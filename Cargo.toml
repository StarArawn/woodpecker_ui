[package]
name = "woodpecker_ui"
version = "0.2.0"
edition = "2021"
description = "A UI library for the Bevy game engine."
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/*"]

[features]
default = []
hotreload = ["dioxus-devtools", "woodpecker_ui_macros/hotreload"]
debug-render = []
metrics = []
gamepad-nav = ["bevy/gamepad"]
devtools = []
bevy_bsn = ["bevy/bevy_scene"]

[dependencies]
ansi-parser = "0.9.1"
autumnus = "0.3.2"
bevy-trait-query = "0.19"
bevy_vello = { path = "../bevy_vello_bevy19", features = ["text", "default_font"] }
bytemuck = "1.23.0"
dioxus-devtools = { version = "0.7.0-alpha.0", optional = true }
image = "0.24"
interpolation = "0.2"
palette = "0.7.6"
parley = "0.7"
pulldown-cmark = { version = "0.13.4", default-features = false }
skrifa = "0.30.0"
smol_str = { version = "0.2", default-features = false }
taffy = { version = "0.12", features = ["flexbox", "grid"] }
thiserror = "1.0"
ttf-parser = "0.25.1"
usvg = "0.44"
web-time = "1.1"

# Local
woodpecker_ui_macros = { version = "0.2", path = "crates/woodpecker_ui_macros" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.4"
bevy = { version = "0.19", default-features = false, features = ["bevy_picking", "bevy_log", "reflect_auto_register"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgpu", "reflect_auto_register"] }
web-sys = { version = "0.3", features = ["Clipboard", "Navigator"] }
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"

[dev-dependencies]
calc = { version = "0.4.0", default-features = false }
bevy = { version = "0.19", features = ["jpeg", "bevy_dev_tools", "reflect_auto_register"] }
bevy-inspector-egui = "0.37"

# [patch.crates-io]
# bevy_vello = { git = "https://github.com/linebender/bevy_vello", rev = "7fe648ccb9766ecf2ef469f08c9f21093c3544e6" }

[[example]]
name = "todo"
path = "examples/todo/todo.rs"

[[example]]
name = "dashboard"
path = "examples/dashboard/dashboard.rs"

[[example]]
name = "game_ui"
path = "examples/game_ui/game_ui.rs"

[[example]]
name = "gallery"
path = "examples/gallery/gallery.rs"

[[example]]
name = "bsn_startup"
path = "examples/bsn_startup.rs"
required-features = ["bevy_bsn"]

[[example]]
name = "bsn_static_ui"
path = "examples/bsn_static_ui.rs"
required-features = ["bevy_bsn"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
